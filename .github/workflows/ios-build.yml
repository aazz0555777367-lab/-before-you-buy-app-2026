name: Build iOS App Store Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Initialize & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Check iOS files
        run: |
          echo "=============================="
          echo "Contents of ios:"
          ls -la ios || true
          echo "=============================="
          echo "Contents of ios/App:"
          ls -la ios/App || true
          echo "=============================="

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build Xcode Project
        run: |
          cd ios/App

          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Using App.xcworkspace"

            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO

          elif [ -f "App.xcodeproj/project.pbxproj" ]; then
            echo "Using App.xcodeproj"

            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO

          else
            echo "ERROR: No Xcode project or workspace was found."
            exit 1
          fi

      - name: Check Archive
        run: |
          echo "Checking generated archive..."

          if [ -d "ios/App/App.xcarchive" ]; then
            echo "SUCCESS: App.xcarchive was created."
            ls -la ios/App/App.xcarchive
          else
            echo "ERROR: App.xcarchive was not created."
            exit 1
          fi

      - name: Upload Xcode Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeforeYouBuy-iOS-Archive
          path: ios/App/App.xcarchive
          if-no-files-found: error