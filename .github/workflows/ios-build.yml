name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Capacitor
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find iOS project
        run: |
          find ios -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print

      - name: Build iOS Archive
        run: |
          cd ios/App

          if [ -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Create IPA
        run: |
          rm -rf Payload BeforeYouBuy.ipa
          mkdir Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/App.app
          /usr/bin/zip -qry BeforeYouBuy.ipa Payload

          echo "IPA created:"
          ls -lh BeforeYouBuy.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BeforeYouBuy-iOS-IPA
          path: BeforeYouBuy.ipa
          if-no-files-found: error